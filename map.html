<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園區地圖｜昆沙紀念館</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="mapTitle">
  <main id="main" class="page">
    <div class="wrap crumb"><a href="index.html" data-i18n="crumbHome">首頁</a> ＞ <a href="visit.html" data-i18n="navVisit">參觀資訊</a> ＞ <span data-i18n="mapTitle">園區地圖</span></div>
    <div class="wrap">
      <h1 class="page-title" data-i18n="mapTitle">園區地圖</h1>
      <p data-i18n="mapP">自入口銅像起，依編號走完十二處。綠色編號為目前可參觀，灰色為暫不開放內覽。</p>
      <div class="map-board" id="map-board"></div>
      <p class="note" data-i18n="mapNote">土牢在騎馬雕像左方山坡。完整解說請點選編號進入各據點內頁。</p>
    </div>
  </main>
  <script src="js/spots.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-spots.js"></script>
  <script src="js/layout.js"></script>
  <script>
    KHUNSA.renderChrome();
    document.getElementById("map-board").innerHTML = KHUNSA.getSpots().map((s) => `
      <a class="map-node ${s.status}" href="spot.html?id=${s.id}">
        <b>${String(s.id).padStart(2, "0")}</b>
        ${s.name}
      </a>
    `).join("");
  </script>
</body>
</html>
