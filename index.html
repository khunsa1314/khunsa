<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昆沙紀念館</title>
  <meta name="description" content="昆沙紀念館（滿星疊）園區網站：參觀資訊、十二景探索、壁畫解說。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page" data-title="siteName">
  <main id="main">
    <h1 class="sr" data-i18n="siteName">昆沙紀念館</h1>

    <section class="stage" id="stage" aria-roledescription="carousel">
      <div class="stage-viewport">
        <div class="stage-track" id="stage-track"></div>
        <button class="stage-pause" type="button" id="stage-pause" aria-pressed="false">❚❚</button>
        <button class="stage-nav stage-prev" type="button" id="stage-prev" aria-label="上一張">‹</button>
        <button class="stage-nav stage-next" type="button" id="stage-next" aria-label="下一張">›</button>
      </div>
    </section>

    <nav class="wrap shortcuts stagger" aria-label="shortcuts">
      <a class="shortcut" href="visit.html">
        <span class="sc-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64"><rect x="12" y="18" width="40" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 28h40M22 18v-4h20v4" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </span>
        <span data-i18n="scVisit">參觀資訊</span>
      </a>
      <a class="shortcut" href="visit.html#status">
        <span class="sc-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M32 18v16l10 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span data-i18n="scHours">開放時間</span>
      </a>
      <a class="shortcut" href="map.html">
        <span class="sc-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M16 20l16-8 16 8v28l-16 8-16-8z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="30" r="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M32 37v11" stroke="currentColor" stroke-width="3"/></svg>
        </span>
        <span data-i18n="scMap">園區地圖</span>
      </a>
      <a class="shortcut" href="#news">
        <span class="sc-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64"><rect x="14" y="12" width="36" height="40" rx="2" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 24h20M22 32h20M22 40h12" stroke="currentColor" stroke-width="3"/></svg>
        </span>
        <span data-i18n="scNews">最新消息</span>
      </a>
      <a class="shortcut" href="about.html">
        <span class="sc-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M12 48h40M16 48V28l16-12 16 12v20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M28 48V34h8v14" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </span>
        <span data-i18n="scHistory">歷史沿革</span>
      </a>
    </nav>

    <section class="orbit-band paper" id="orbit">
      <div class="wrap">
        <p class="orbit-home"><a href="index.html" data-i18n="orbitHome">首頁</a></p>
        <h2 class="sr" data-i18n="orbitTitle">虛擬園區</h2>
        <div class="orbit" id="orbit-map"></div>
      </div>
    </section>

    <section class="wrap section paper-pad" id="halls">
      <h2 class="sr" data-i18n="hallsTitle">館藏展廳</h2>
      <div class="exhibits">
        <article class="exhibit">
          <a href="spot.html?id=1"><img src="images/photos/18.jpg" alt="" data-i18n-alt="hall1Title"></a>
          <p class="plaque" data-i18n="hall1Title">騎馬青銅雕像</p>
          <div class="exhibit-body">
            <h3 data-i18n="hall1Title">騎馬青銅雕像</h3>
            <p data-i18n="hall1Text">園區入口最醒目的地標。村民於昆沙先生過世後鑄成馬上英姿，還原他在金三角山區策馬的樣貌。</p>
            <a class="more-btn" href="spot.html?id=1" data-i18n="readMore">閱讀全文</a>
          </div>
        </article>
        <article class="exhibit">
          <a href="about.html"><img src="images/photos/16.jpg" alt="" data-i18n-alt="hall2Title"></a>
          <p class="plaque" data-i18n="hall2Title">坐像</p>
          <div class="exhibit-body">
            <h3 data-i18n="hall2Title">坐像</h3>
            <p data-i18n="hall2Text">館內坐像呈現日常起居的樸實儀態，與外界對武裝領袖居所的刻板印象不同。</p>
            <a class="more-btn" href="about.html" data-i18n="readMore">閱讀全文</a>
          </div>
        </article>
      </div>
    </section>

    <section class="wrap section" id="scenes">
      <h2 data-i18n="scenesTitle">園區據點</h2>
      <div class="scenes" id="scene-grid"></div>
    </section>

    <section class="wrap section" id="explore">
      <h2 data-i18n="catalogTitle">館藏目錄</h2>
      <div class="catalog" id="catalog-grid"></div>
    </section>

    <section class="wrap section" id="news">
      <h2 data-i18n="newsTitle">園內情報</h2>
      <div class="two-col">
        <div class="side-box">
          <h2 data-i18n="newsUpdates">園區動態</h2>
          <div class="news-list" id="news-list"></div>
        </div>
        <div class="side-box">
          <h2 data-i18n="recTitle">建議行程</h2>
          <ul>
            <li><a href="visit.html#route" data-i18n="rec1">半日開放路線：銅像 → 土牢 → 炸彈殘骸 → 導覽室 → 壁畫</a></li>
            <li><a href="map.html" data-i18n="rec2">十二景編號地圖</a></li>
            <li><a href="visit.html#rules" data-i18n="rec3">遊園須知：不進入暫不開放房舍</a></li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <script src="js/spots.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-spots.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
